name: kashan_energy
description: مدیریت هوشمند انرژی شهر کاشان
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  fl_chart: ^0.69.0
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2

flutter:
  uses-material-design: true
  # اختیاری: فونت وزیرمتن را در assets/fonts قرار دهید و اینجا معرفی کنید،
  # سپس در main.dart مقدار fontFamily را 'Vazirmatn' بگذارید.
